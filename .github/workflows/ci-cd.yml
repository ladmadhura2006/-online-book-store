name: CI/CD Pipeline - Online Book Store

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Stage 2: Build
      - name: 2. Build / Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "Build step completed successfully."

      # Stage 3: Test
      - name: 3. Run Automated Tests
        run: |
          echo "Running unit tests for login functionality..."
          python -m py_compile login.py
          echo "Tests passed successfully."

      # Stage 4: Package
      - name: 4. Package Application
        run: |
          echo "Packaging application into artifact..."
          tar -czvf online-book-store.tar.gz login.py
          echo "Package created: online-book-store.tar.gz"

      # Stage 5: Deploy
      - name: 5. Deploy Application
        run: |
          echo "Deploying application to staging/production environment..."
          echo "Deployment successful."
